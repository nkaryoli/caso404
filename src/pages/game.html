<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Aerena</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <h1>Quiz Aerena</h1>
        <div class="player-info">
          <span id="player-name" class="player-name"></span>
          <img src="../img/user.png" alt="Avatar del investigador" />
        </div>
      </nav>
      <div class="navbar-action-buttons">
        <a href="./menu.html" id="" class="back-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-left preview-icon"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
          Menú
        </a>
        <button id="logout-button" class="logout-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-log-out preview-icon"
          >
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <section class="game-container">
        <div id="questions-list" class="questions-list"></div>
        <div class="global-actions">
          <button id="global-check-button" class="check-button hidden">
            COMPROBAR RESPUESTA
          </button>
        </div>
      </section>
    </main>
    <div id="results-modal" class="modal hidden">
      <div class="modal-content">
        <p class="modal-case">QUIZ ARENA</p>
        <h2 id="results-title">RONDA FINALIZADA</h2>
        <p id="results-subtitle"></p>
        <div class="statistics">
          <div class="stat">
            <span class="stat-label">PREGUNTAS</span>
            <span id="total-questions" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">ACIERTOS</span>
            <span id="correct-answers" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">FALLOS</span>
            <span id="wrong-answers" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">PRECISIÓN</span>
            <span id="accuracy" class="stat-value">0%</span>
          </div>
        </div>
        <button id="restart-button">VOLVER AL MENÚ</button>
      </div>
    </div>
    <script type="module" src="../js/game-page.js"></script>
  </body>
</html>
