<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caso 404</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  </head>

  <body>
    <main>
      <section id="home">
        <div class="intro">
          <h2>EL SERVIDOR HA DESAPARECIDO</h2>
          <p>
            Un servidor crítico ha desaparecido de la red. Necesitamos un
            investigador capaz de resolver las pruebas y localizarlo.
          </p>
          <p>Introduce tu nombre de investigador para comenzar.</p>
          <form id="username-form" class="username-form">
            <label for="username">Nombre de investigador</label>
            <input
              type="text"
              id="username"
              placeholder="Introduce tu nombre..."
              autocomplete="off"
            />
            <button id="start-button" type="submit">
              INICIAR INVESTIGACIÓN
            </button>
            <p id="error-message" class="error-message"></p>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
